experiment:
  name: resnet50_regularization
  seed: 42
model:
  num_classes: 200
  weights: IMAGENET1K_V2
  dropout: 0.3
data:
  prepared_dir: preparation
  image_size: 224
  geometry: fit
  normalization: imagenet
  augmentation: mild
  batch_size: 32
  num_workers: 0
training:
  device: cuda
  optimizer: adamw
  weight_decay: 0.01
  label_smoothing: 0.1
  head:
    epochs: 3
    learning_rate: 0.001
  finetune:
    epochs: 10
    encoder_learning_rate: 0.000003
    classifier_learning_rate: 0.00003
    early_stopping:
      patience: 3
      min_delta: 0.001
checkpoints:
  local_root: outputs/resnet50
  selection_metric: val_accuracy
tracking:
  backend: mlflow
  local_dir: outputs/resnet50/mlruns
