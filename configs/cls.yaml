# CUB-200-2011 From-Scratch ResNet Classification Configuration
task: classification

data:
  prepared_dir: "outputs/preparation"
  batch_size: 32
  num_workers: 4
  seed: 42
  strong_augment: true

model:
  architecture: "scratch_resnet"
  activation: "relu"  # "relu" or "leaky_relu"
  head_dropout: 0.4
  num_classes: 200

training:
  epochs: 300
  optimizer: "adam"         # "adam", "sgd", "adagrad"
  learning_rate: 0.001
  weight_decay: 0.0005
  label_smoothing: 0.1
  seed: 42
  amp: true

tuning:
  epochs_per_trial: 2
  random_trials: 4
  grid:
    optimizer: ["adam", "sgd", "adagrad"]
    learning_rate: [0.001, 0.0003]
    activation: ["relu", "leaky_relu"]

output_dir: "outputs/classification_run"
